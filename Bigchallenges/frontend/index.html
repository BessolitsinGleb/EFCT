<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Прототип полуавтоматизированного контейнерного терминала</title>

    <style>
      :root {
        --bg: linear-gradient(135deg, #f4efe4 0%, #dfe8f3 100%);
        --panel: rgba(255, 252, 247, 0.92);
        --panel-dark: #17324a;
        --line: rgba(23, 50, 74, 0.16);
        --text: #102332;
        --muted: #556b7c;
        --accent: #d34d2d;
        --accent-dark: #a9381d;
        --empty: #f7f1e8;
        --busy: #cfe3f6;
        --shadow: 0 20px 45px rgba(19, 41, 60, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
        margin-bottom: 24px;
      }

      .hero-card,
      .summary,
      .card,
      .table-panel {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .hero-card {
        padding: 28px;
      }

      .hero h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }

      .hero p {
        margin: 0;
        max-width: 60ch;
        color: var(--muted);
        font-size: 1rem;
      }

      .hero-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .summary {
        padding: 24px;
        display: grid;
        gap: 12px;
      }

      .summary-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .stat {
        border-radius: 18px;
        padding: 14px;
        background: rgba(207, 227, 246, 0.46);
        border: 1px solid rgba(16, 35, 50, 0.08);
      }

      .stat strong {
        display: block;
        font-size: 1.7rem;
        margin-bottom: 4px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
        gap: 20px;
      }

      .controls {
        display: grid;
        gap: 14px;
        align-content: start;
      }

      .card {
        overflow: hidden;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        cursor: pointer;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.9rem;
      }

      .card-header:hover {
        background: rgba(207, 227, 246, 0.28);
      }

      .arrow {
        transition: transform 0.25s ease;
      }

      .card-content {
        display: none;
        padding: 0 20px 20px;
      }

      .card-content.open {
        display: block;
      }

      label {
        display: block;
        margin: 12px 0 6px;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      input,
      select,
      button {
        width: 100%;
        border-radius: 14px;
        font: inherit;
      }

      input,
      select {
        border: 1px solid var(--line);
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--text);
      }

      button {
        border: 0;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          opacity 0.18s ease,
          background 0.18s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent-dark);
      }

      .btn-secondary {
        background: #183852;
        color: white;
      }

      .btn-secondary:hover {
        background: #10293d;
      }

      .btn-ghost {
        background: rgba(24, 56, 82, 0.08);
        color: var(--text);
      }

      .result,
      .info-box {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(16, 35, 50, 0.08);
        white-space: pre-wrap;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 0.92rem;
        min-height: 48px;
      }

      .workspace {
        display: grid;
        gap: 20px;
      }

      .table-panel {
        padding: 20px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .panel-head p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .layer-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .terminal-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .layer-card {
        border-radius: 20px;
        padding: 14px;
        background: rgba(207, 227, 246, 0.3);
        border: 1px solid rgba(16, 35, 50, 0.08);
      }

      .layer-card.active {
        background: rgba(211, 77, 45, 0.14);
        border-color: rgba(211, 77, 45, 0.28);
      }

      .layer-card h3 {
        margin: 0 0 12px;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid rgba(16, 35, 50, 0.08);
        text-align: center;
        padding: 10px 8px;
      }

      th {
        background: rgba(24, 56, 82, 0.1);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      td.empty {
        background: var(--empty);
        color: #85786e;
      }

      td.busy {
        background: var(--busy);
        font-weight: 700;
      }

      .moves-table {
        overflow-x: auto;
      }

      .moves-table table {
        min-width: 560px;
      }

      .subtle {
        color: var(--muted);
        font-size: 0.88rem;
      }

      @media (max-width: 1024px) {
        .hero,
        .layout,
        .terminal-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 18px 14px 28px;
        }

        .hero-card,
        .summary,
        .table-panel,
        .card-header,
        .card-content {
          padding-left: 16px;
          padding-right: 16px;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Прототип полуавтоматизированного контейнерного терминала</h1>

    <div class="card">
      <div class="card-header" onclick="toggle(this)">
        Найти ячейки
        <span class="arrow">▼</span>
      </div>
      <div class="card-content">
        <input id="find_cells_value" placeholder="value" />
        <button onclick="findCells()">Запустить</button>
        <div class="result" id="res_find_cells"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" onclick="toggle(this)">
        Добавить контейнер
        <span class="arrow">▼</span>
      </div>
      <div class="card-content">
        <input id="add_cell_id" placeholder="cell_id" />
        <input id="add_value" placeholder="value" />
        <button onclick="addContainer()">Запустить</button>
        <div class="result" id="res_add"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" onclick="toggle(this)">
        Проверить контейнер
        <span class="arrow">▼</span>
      </div>
      <div class="card-content">
        <input id="check_num" placeholder="cont_num" />
        <button onclick="checkContainer()">Запустить</button>
        <div class="result" id="res_check"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" onclick="toggle(this)">
        Найти контейнер по ячейке
        <span class="arrow">▼</span>
      </div>
      <div class="card-content">
        <input id="find_cont_cell" placeholder="cell_id" />
        <button onclick="findContainer()">Запустить</button>
        <div class="result" id="res_find_cont"></div>
      </div>
    </div>

    <!-- LOADING -->
    <div class="card">
      <div class="card-header" onclick="toggle(this)">
        Погрузка на транспорт
        <span class="arrow">▼</span>
      </div>
      <div class="card-content">
        <input id="loading_value" placeholder="value" />
        <button onclick="loading()">Запустить</button>
        <div class="result" id="res_loading"></div>
      </div>
    </div>

    <!-- REARRANGEMENT -->
    <div class="card">
      <div class="card-header" onclick="toggle(this)">
        Перестановка контейнера
        <span class="arrow">▼</span>
      </div>
      <div class="card-content">
        <input id="re_value" placeholder="value" />
        <input id="re_cell" placeholder="cell" />
        <button onclick="rearrangement()">Запустить</button>
        <div class="result" id="res_re"></div>
      </div>
    </div>

    <h2>Слой контейнеров</h2>

    <div class="layer-block">
      <input id="layer_input" placeholder="Введите слой (A, B, C)" />
      <button onclick="loadLayer()">Показать</button>

      <table id="layer_table"></table>
    </div>

    <h2>Движения контейнеров</h2>

    <div class="moves-block">
      <button onclick="loadMoves()">Загрузить движения</button>

      <table id="moves_table"></table>
    </div>

    <script>
      const API = "http://127.0.0.1:8000";

      / переключение вкладок /;
      function toggle(header) {
        const content = header.nextElementSibling;
        const arrow = header.querySelector(".arrow");

        if (content.style.display === "block") {
          content.style.display = "none";
          arrow.style.transform = "rotate(0deg)";
        } else {
          content.style.display = "block";
          arrow.style.transform = "rotate(180deg)";
        }
      }

      / универсальный fetch /;
      function post(url, data, resultId) {
        fetch(API + url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById(resultId).innerText = JSON.stringify(
              data,
              null,
              2,
            );
          })
          .catch((err) => {
            document.getElementById(resultId).innerText = err;
          });
      }

      / endpoints */;

      function findCells() {
        const value = document.getElementById("find_cells_value").value;

        fetch(`http://127.0.0.1:8000/container/find_cells?value=${value}`)
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("res_find_cells").innerText =
              JSON.stringify(data, null, 2);
          });
      }

      function addContainer() {
        post(
          "/container/add",
          {
            cell_id: document.getElementById("add_cell_id").value,
            value: document.getElementById("add_value").value,
          },
          "res_add",
        );
      }

      function checkContainer() {
        const cont_num = document.getElementById("check_num").value;

        fetch(`http://127.0.0.1:8000/container/check?cont_num=${cont_num}`)
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("res_check").innerText = JSON.stringify(
              data,
              null,
              2,
            );
          });
      }

      function findContainer() {
        const cell_id = document.getElementById("find_cont_cell").value;

        fetch(`http://127.0.0.1:8000/container/find_cont?cell_id=${cell_id}`)
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("res_find_cont").innerText = JSON.stringify(
              data,
              null,
              2,
            );
          });
      }

      function loading() {
        const value = document.getElementById("loading_value").value;

        fetch(`http://127.0.0.1:8000/container/loading?value=${value}`, {
          method: "POST",
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("res_loading").innerText = JSON.stringify(
              data,
              null,
              2,
            );
          });
      }

      function rearrangement() {
        const value = document.getElementById("re_value").value;
        const cell = document.getElementById("re_cell").value;

        fetch(
          `http://127.0.0.1:8000/container/rearrangement?value=${value}&cell=${cell}`,
          {
            method: "POST",
          },
        )
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("res_re").innerText = JSON.stringify(
              data,
              null,
              2,
            );
          });
      }

      function loadLayer() {
        const layer = document.getElementById("layer_input").value;

        fetch(`http://127.0.0.1:8000/container/layer?layer=${layer}`)
          .then((res) => res.json())
          .then((data) => {
            // сортировка: AX1, AY1, AZ1 ... AX2 ...
            data.sort((a, b) => {
              const parse = (cell) => {
                const col = cell[1]; // X Y Z
                const row = parseInt(cell.slice(2));
                return { col, row };
              };

              const A = parse(a.cell_id);
              const B = parse(b.cell_id);

              if (A.row !== B.row) return A.row - B.row;
              return A.col.localeCompare(B.col);
            });

            const table = document.getElementById("layer_table");
            table.innerHTML = "";

            let currentRow = -1;
            let tr;

            data.forEach((item) => {
              const rowNum = parseInt(item.cell_id.slice(2));

              if (rowNum !== currentRow) {
                tr = document.createElement("tr");
                table.appendChild(tr);
                currentRow = rowNum;
              }

              const td = document.createElement("td");
              td.innerText = `${item.cell_id}\n${item.value}`;
              tr.appendChild(td);
            });
          });
      }
      function loadMoves() {
        fetch("http://127.0.0.1:8000/container/mooves")
          .then((res) => res.json())
          .then((data) => {
            const table = document.getElementById("moves_table");
            table.innerHTML = "";

            const header = document.createElement("tr");
            header.innerHTML = `
              <th>Контейнер</th>
              <th>Дата загрузки</th>
              <th>Дата выгрузки</th>
            `;
            table.appendChild(header);

            data.forEach((item) => {
              const tr = document.createElement("tr");

              tr.innerHTML = `
                <td>${item.value}</td>
                <td>${item.added_at}</td>
                <td>${item.deleted_at}</td>
              `;

              table.appendChild(tr);
            });
          });
      }
    </script>
  </body>
</html>
